<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Hall of Fame</title>
<meta name="description" content="A journey through what AI systems have actually done, from Turing's question in 1950 to this month, with every case dated and cited.">
<meta property="og:title" content="AI Hall of Fame">
<meta property="og:description" content="What AI has actually done, dated and cited.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230B0F17'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%23F2B84B'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('hof-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/home.css">
</head>
<body>
<header class="bar">
  <a class="wordmark" href="./"><i aria-hidden="true"></i>AI Hall of Fame</a>
  <nav class="topnav" aria-label="Site">
    <a href="./" aria-current="page">Timeline</a>
    <div class="menu" id="fieldsmenu">
      <button class="menubtn" id="fieldsbtn" aria-expanded="false" aria-haspopup="true">Fields <span aria-hidden="true">▾</span></button>
      <div class="pop" id="fieldspop" hidden><div class="popgrid" id="fieldslist"></div><a class="allbtn small" href="explore.html">All cases <small id="allcount2"></small> →</a></div>
    </div>
    <button class="menubtn" id="aboutbtn">About</button>
    <a href="https://github.com/adamghaida/ai-hall-of-fame" target="_blank" rel="noopener">GitHub</a>
    <a class="allbtn" id="allbtn" href="explore.html">All cases <small id="allcount"></small> →</a>
    <button class="themebtn" id="themebtn" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
  </nav>
</header>

<main class="stage" aria-label="Timeline">
  <div class="bigyear" id="bigyear" aria-hidden="true">1950</div>
  <a class="pill" id="pill" href="explore.html">Check out all <b id="pillcount">68</b> cases <span aria-hidden="true">→</span></a>
  <div class="wrap" id="wrap"><div class="track" id="track"></div></div>
  <div class="empty" id="empty">Nothing matches. Clear a filter or try another word.</div>
  <div class="hint" id="hint"><p><b>Scroll, drag, or use ← →</b> to move through time. Click a card for the record.</p>
    <div class="legend"><span class="s"><i>★</i>landmark</span><span class="a"><i></i>documented case</span><span class="l"><i></i>model release</span><span class="p"><i></i>prize</span><span class="o"><i></i>origin</span></div></div>
</main>

<div class="deck" aria-label="Filters and controls">
  <div class="chips" role="group" aria-label="Type" id="chips">
    <button class="chip" data-k="" aria-pressed="true">All</button>
    <button class="chip star" data-k="star" aria-pressed="false">★ Landmarks</button>
    <button class="chip" data-k="achievement" aria-pressed="false">Cases</button>
    <button class="chip" data-k="launch" aria-pressed="false">Releases</button>
    <button class="chip" data-k="prize" aria-pressed="false">Prizes</button>
    <button class="chip" data-k="origin" aria-pressed="false">Origins</button>
  </div>
  <label><span class="sr">Field</span><select class="sel" id="field"><option value="">All fields</option></select></label>
  <label><span class="sr">Search</span><input class="q" id="q" type="search" placeholder="Search moments" autocomplete="off"></label>
  <div class="hud">
    <button class="b" id="prev" aria-label="Previous moment">←</button>
    <span class="n" id="counter">1 / 36</span>
    <button class="b" id="next" aria-label="Next moment">→</button>
    <button class="b play" id="play" aria-pressed="false">▶ Play</button>
  </div>
</div>

<footer class="axis" aria-label="Every moment, to scale">
  <svg id="axis" role="img" aria-label="Every moment placed to scale from 1950 to today. Click a mark to jump to it."></svg>
</footer>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Moment details"><div class="in" id="drawer-in"></div></aside>

<script src="assets/theme.js"></script>
<script src="assets/home.js"></script>
</body>
</html>
